name: TestDriver Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        site:
          - name: "OpenCode"
            url: "https://opencode.ai"
          - name: "Terminal Shop"
            url: "https://terminal.shop"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run TestDriver Tests for ${{ matrix.site.name }}
        env:
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          TD_WEBSITE: ${{ matrix.site.url }}
        run: |
          echo "Testing ${{ matrix.site.name }} at ${{ matrix.site.url }}"
          npx testdriverai@latest run testdriver/generate/*.yaml || true

      - name: Upload Test Results for ${{ matrix.site.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testdriver-results-${{ matrix.site.name }}
          path: testdriver/results/
          if-no-files-found: ignore